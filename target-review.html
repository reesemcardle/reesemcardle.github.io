<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Target Review</title><link rel="stylesheet" href="/target-review.css"><script type="module" src="/scripts/target-review.mjs"></script></head>
<body>
<header><h1>Target review</h1><span id="saveStatus" role="status">Loading</span><button id="reload">Reload</button><button id="save" class="primary" disabled>Save review</button></header>
<main>
  <nav class="queue" aria-label="Target photos"><h2>Photos</h2><div id="queue"></div></nav>
  <section class="editor" aria-label="Photo annotation">
    <div class="toolbar"><fieldset><legend class="sr-only">Photo tool</legend><label><input type="radio" name="tool" value="select" checked>Select / move</label><label><input type="radio" name="tool" value="add">Add mark</label></fieldset><button id="fit">Fit</button><label>Zoom<input id="zoom" type="range" min="0.7" max="12" value="1" step="0.1"></label><label><input id="labels" type="checkbox" checked>Numbers</label><label><input id="overlay" type="checkbox" checked>Marks</label><span>Right-drag to pan</span></div>
    <div class="stage"><svg id="photo" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="Target photo with editable numbered impacts"><image id="photoImage"></image><g id="markers"></g></svg><p id="empty" hidden>No imported target photos</p></div>
    <div class="photo-footer"><span id="counts"></span><button id="previous">Previous photo</button><button id="next">Next photo</button></div>
  </section>
  <aside aria-label="Review details">
    <label>Target name<input id="name" maxlength="160"></label>
    <label>Capture date<input id="date" type="date"></label>
    <strong id="selectedTitle">No mark selected</strong><p id="observation"></p>
    <div class="actions"><button id="delete" disabled>Delete mark</button><button id="undo" disabled>Undo edit</button></div>
    <div class="mark-heading"><h2>Marks</h2><label><input id="flaggedOnly" type="checkbox" checked>Flagged first</label></div>
    <div id="markList" class="mark-list"></div>
  </aside>
</main>
</body></html>
